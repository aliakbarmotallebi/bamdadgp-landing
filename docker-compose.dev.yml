name: bamdadgp-web-dev

services:
  traefik:
    image: traefik:v2.11
    container_name: bamdadgp-traefik-dev
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-proxy"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-proxy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bamdadgp-web-dev
    restart: unless-stopped
    depends_on:
      - traefik
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.bamdadgp-web-dev.rule=Host(`localhost`) || Host(`web.localhost`)"
      - "traefik.http.routers.bamdadgp-web-dev.entrypoints=web"
      - "traefik.http.services.bamdadgp-web-dev.loadbalancer.server.port=3000"

networks:
  traefik-proxy:
    name: traefik-proxy

volumes:
  web_node_modules:
  web_next:
