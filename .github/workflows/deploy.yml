name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      # Persistent on the server — never overwritten by checkout
      ENV_FILE: /opt/www/bamdadgp-landing/.env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load persistent .env
        run: |
          set -euo pipefail
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Missing $ENV_FILE — create it once on the server (see .env.docker.example)"
            exit 1
          fi
          cp "$ENV_FILE" .env
          chmod 600 .env

      - name: Docker Compose up
        run: |
          set -euo pipefail

          if docker compose version &>/dev/null; then
            COMPOSE="docker compose"
          elif command -v docker-compose &>/dev/null; then
            COMPOSE="docker-compose"
          else
            echo "::error::Docker Compose is not installed"
            exit 1
          fi

          $COMPOSE -f docker-compose.yml up -d --build --remove-orphans
